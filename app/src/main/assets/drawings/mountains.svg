<svg xmlns="http://www.w3.org/2000/svg" 
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Mountains -->
  <polygon points="20,70 40,30 60,70"
           fill="none" stroke="black" stroke-width="2" />
  <polygon points="40,70 60,40 80,70"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Sun -->
  <circle cx="70" cy="20" r="8"
          fill="none" stroke="black" stroke-width="2" />
  <!-- Sun rays (4 lines) -->
  <line x1="70" y1="8" x2="70" y2="2"
        stroke="black" stroke-width="2"/>
  <line x1="70" y1="32" x2="70" y2="38"
        stroke="black" stroke-width="2"/>
  <line x1="58" y1="20" x2="52" y2="20"
        stroke="black" stroke-width="2"/>
  <line x1="82" y1="20" x2="88" y2="20"
        stroke="black" stroke-width="2"/>
</svg>