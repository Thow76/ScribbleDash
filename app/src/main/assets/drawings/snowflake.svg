<svg xmlns="http://www.w3.org/2000/svg" 
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Center -->
  <circle cx="50" cy="50" r="2"
          fill="none" stroke="black" stroke-width="2" />
  <!-- 6 lines radiating out (like a star) -->
  <line x1="50" y1="50" x2="50" y2="30"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="70"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="30" y2="50"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="70" y2="50"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="35" y2="35"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="50" x2="65" y2="65"
        stroke="black" stroke-width="2"/>
  <!-- Small branch ends on lines -->
  <line x1="50" y1="35" x2="47" y2="32"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="35" x2="53" y2="32"
        stroke="black" stroke-width="2"/>
  <line x1="65" y1="50" x2="68" y2="47"
        stroke="black" stroke-width="2"/>
  <line x1="65" y1="50" x2="68" y2="53"
        stroke="black" stroke-width="2"/>
  <line x1="35" y1="50" x2="32" y2="47"
        stroke="black" stroke-width="2"/>
  <line x1="35" y1="50" x2="32" y2="53"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="65" x2="47" y2="68"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="65" x2="53" y2="68"
        stroke="black" stroke-width="2"/>
  <line x1="35" y1="35" x2="33" y2="33"
        stroke="black" stroke-width="2"/>
  <line x1="65" y1="65" x2="67" y2="67"
        stroke="black" stroke-width="2"/>
</svg>