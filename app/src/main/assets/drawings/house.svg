<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">
  <!-- House base -->
  <rect x="60" y="80" width="80" height="60" stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Roof -->
  <path d="M60,80 L100,50 L140,80 Z" stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="90" y="100" width="20" height="40" stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Window -->
  <rect x="70" y="90" width="10" height="10" stroke="black" fill="none" stroke-width="2"/>
  <rect x="120" y="90" width="10" height="10" stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Tree trunk -->
  <rect x="20" y="90" width="10" height="50" stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Tree foliage -->
  <circle cx="25" cy="70" r="20" stroke="black" fill="none" stroke-width="2"/>
</svg>