<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" 
     viewBox="0 0 100 100">
  <!-- Body -->
  <ellipse cx="50" cy="60" rx="15" ry="10"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Head -->
  <ellipse cx="50" cy="45" rx="10" ry="6"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Eyes (on top of head) -->
  <circle cx="44" cy="38" r="3"
          fill="none" stroke="black" stroke-width="2" />
  <circle cx="56" cy="38" r="3"
          fill="none" stroke="black" stroke-width="2" />
  <!-- Mouth -->
  <path d="M45,48 Q50,52 55,48"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Feet (simple arcs) -->
  <path d="M35,65 Q30,70 35,75"
        fill="none" stroke="black" stroke-width="2" />
  <path d="M65,65 Q70,70 65,75"
        fill="none" stroke="black" stroke-width="2" />
</svg>