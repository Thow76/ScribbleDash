<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Outer shape (eye) -->
  <path d="M20,50 Q50,20 80,50 
           Q50,80 20,50 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Iris -->
