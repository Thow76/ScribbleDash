<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Head -->
  <circle cx="100" cy="70" r="20"
          stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Ears -->
  <path d="M85,50 L80,30 L95,50 Z"
        stroke="black" fill="none" stroke-width="2"/>
  <path d="M115,50 L120,30 L105,50 Z"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="30" ry="40"
           stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="
    M130,110 
    C150,100 150,140 130,130
  "
  stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Legs -->
  <path d="M85,150 L85,170" stroke="black" fill="none" stroke-width="2"/>
  <path d="M115,150 L115,170" stroke="black" fill="none" stroke-width="2"/>
</svg>