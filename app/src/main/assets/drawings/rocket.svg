<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Rocket Body (ellipse) -->
  <ellipse cx="50" cy="40" rx="10" ry="20"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Nose Cone -->
  <polygon points="40,20 60,20 50,5"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Fins -->
  <polygon points="40,50 30,60 40,60"
           fill="none" stroke="black" stroke-width="2" />
  <polygon points="60,50 60,60 70,60"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Exhaust Flame -->
  <path d="M45,60 C45,68 55,68 55,60 L50,70 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Small Window -->
  <circle cx="50" cy="35" r="3"
          fill="none" stroke="black" stroke-width="2" />
</svg>