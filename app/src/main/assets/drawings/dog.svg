<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Head -->
  <circle cx="30" cy="40" r="10"
          fill="none" stroke="black" stroke-width="2" />
  <!-- Snout -->
  <path d="M40,40 L50,38 L50,42 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Ear -->
  <polygon points="25,30 30,25 35,30"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Body -->
  <ellipse cx="50" cy="55" rx="15" ry="10"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Tail -->
  <path d="M65,50 Q75,45 70,55"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Legs (simple lines) -->
  <line x1="40" y1="65" x2="40" y2="75"
        stroke="black" stroke-width="2" />
  <line x1="50" y1="65" x2="50" y2="75"
        stroke="black" stroke-width="2" />
  <line x1="57" y1="65" x2="57" y2="75"
        stroke="black" stroke-width="2" />
</svg>