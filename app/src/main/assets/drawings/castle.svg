<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Main wall -->
  <rect x="20" y="40" width="60" height="30"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Battlements (top squares) -->
  <rect x="20" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="30" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="40" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="50" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="60" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="70" y="35" width="5" height="5"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Center gate (arched) -->
  <path d="M45,70 L45,60 Q50,50 55,60 L55,70 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Two side towers -->
  <rect x="15" y="30" width="5" height="40"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="80" y="30" width="5" height="40"
        fill="none" stroke="black" stroke-width="2" />
</svg>