<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Body -->
  <ellipse cx="40" cy="50" rx="15" ry="10"
           fill="none" stroke="black" stroke-width="2" />
  <!-- Tail -->
  <line x1="55" y1="50" x2="75" y2="50"
        stroke="black" stroke-width="2" fill="none"/>
  <!-- Tail Fin -->
  <line x1="75" y1="50" x2="80" y2="45"
        stroke="black" stroke-width="2" fill="none"/>
  <line x1="75" y1="50" x2="80" y2="55"
        stroke="black" stroke-width="2" fill="none"/>
  <!-- Rotors (top) -->
  <line x1="40" y1="40" x2="40" y2="30"
        stroke="black" stroke-width="2" fill="none"/>
  <line x1="25" y1="30" x2="55" y2="30"
        stroke="black" stroke-width="2" fill="none"/>
  <!-- Landing Skids -->
  <line x1="30" y1="60" x2="45" y2="60"
        stroke="black" stroke-width="2" fill="none"/>
  <line x1="35" y1="60" x2="35" y2="55"
        stroke="black" stroke-width="2" fill="none"/>
  <line x1="40" y1="60" x2="40" y2="55"
        stroke="black" stroke-width="2" fill="none"/>
</svg>