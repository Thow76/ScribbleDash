<svg xmlns="http://www.w3.org/2000/svg" 
     width="100" height="100" 
     viewBox="0 0 100 100">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="25"
          fill="none" stroke="black" stroke-width="2" />
  <!-- Ticks (12, 3, 6, 9) -->
  <line x1="50" y1="25" x2="50" y2="20"
        stroke="black" stroke-width="2"/>
  <line x1="75" y1="50" x2="80" y2="50"
        stroke="black" stroke-width="2"/>
  <line x1="50" y1="75" x2="50" y2="80"
        stroke="black" stroke-width="2"/>
  <line x1="25" y1="50" x2="20" y2="50"
        stroke="black" stroke-width="2"/>
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="35"
        stroke="black" stroke-width="2"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="60" y2="50"
        stroke="black" stroke-width="2"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="1"
          fill="none" stroke="black" stroke-width="2" />
</svg>