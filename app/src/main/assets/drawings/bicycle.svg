<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" 
     viewBox="0 0 100 100">
  <!-- Wheels -->
  <circle cx="30" cy="70" r="10"
          fill="none" stroke="black" stroke-width="2" />
  <circle cx="70" cy="70" r="10"
          fill="none" stroke="black" stroke-width="2" />
  <!-- Frame -->
  <line x1="30" y1="70" x2="40" y2="50"
        stroke="black" stroke-width="2" fill="none" />
  <line x1="40" y1="50" x2="70" y2="70"
        stroke="black" stroke-width="2" fill="none" />
  <line x1="40" y1="50" x2="50" y2="70"
        stroke="black" stroke-width="2" fill="none" />
  <!-- Handlebar -->
  <line x1="40" y1="50" x2="30" y2="40"
        stroke="black" stroke-width="2" fill="none" />
  <!-- Seat -->
  <line x1="50" y1="70" x2="55" y2="60"
        stroke="black" stroke-width="2" fill="none" />
</svg>