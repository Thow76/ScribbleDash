<svg xmlns="http://www.w3.org/2000/svg" 
     width="100" height="100"
     viewBox="0 0 100 100">
  <!-- Cover (left) -->
  <path d="M20,20 L40,20 L40,60 L20,60 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Cover (right) -->
  <path d="M40,20 L60,20 L60,60 L40,60 Z"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Spine lines -->
  <line x1="40" y1="20" x2="40" y2="60"
        stroke="black" stroke-width="2" fill="none"/>
  <!-- Slight page lines (three horizontal lines) -->
  <line x1="25" y1="25" x2="35" y2="25"
        stroke="black" stroke-width="2" />
  <line x1="25" y1="35" x2="35" y2="35"
        stroke="black" stroke-width="2" />
  <line x1="25" y1="45" x2="35" y2="45"
        stroke="black" stroke-width="2" />
</svg>