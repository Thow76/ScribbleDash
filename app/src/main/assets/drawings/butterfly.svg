<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Butterfly body -->
  <line x1="100" y1="70" x2="100" y2="130" stroke="black" stroke-width="3"/>

  <!-- Antennae -->
  <path d="M100,70 C95,60 90,50 95,40" stroke="black" fill="none" stroke-width="2"/>
  <path d="M100,70 C105,60 110,50 105,40" stroke="black" fill="none" stroke-width="2"/>

  <!-- Top left wing -->
  <path d="M100,70 C60,40 50,100 100,100" stroke="black" fill="none" stroke-width="2"/>
  <!-- Bottom left wing -->
  <path d="M100,100 C60,130 50,160 100,130" stroke="black" fill="none" stroke-width="2"/>

  <!-- Top right wing -->
  <path d="M100,70 C140,40 150,100 100,100" stroke="black" fill="none" stroke-width="2"/>
  <!-- Bottom right wing -->
  <path d="M100,100 C140,130 150,160 100,130" stroke="black" fill="none" stroke-width="2"/>
</svg>