<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Whale body -->
  <path d="
    M40,100
    C50,80 80,70 100,80
    C120,90 140,110 160,110
    C140,130 100,130 80,120
    C60,110 50,100 40,100
    Z
  "
  stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Tail fin -->
  <path d="
    M160,110
    L180,100
    L180,120
    Z
  "
  stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Eye -->
  <circle cx="70" cy="95" r="3"
          stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Water spout -->
  <path d="
    M100,80
    C105,70 110,60 105,50
    M105,50
    C100,45 90,45 95,50
  "
  stroke="black" fill="none" stroke-width="2"/>
</svg>