<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Engine front -->
  <rect x="40" y="80" width="40" height="30"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Engine cab -->
  <rect x="30" y="50" width="50" height="30"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Funnel/Smoke stack -->
  <rect x="35" y="40" width="10" height="10"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Main body -->
  <rect x="80" y="70" width="60" height="40"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="50" cy="110" r="8"
          stroke="black" fill="none" stroke-width="2"/>
  <circle cx="100" cy="110" r="8"
          stroke="black" fill="none" stroke-width="2"/>
  <circle cx="130" cy="110" r="8"
          stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Coupling or hitch -->
  <line x1="140" y1="90" x2="150" y2="90"
        stroke="black" stroke-width="2"/>
  
  <!-- Smoke (optional simple arcs) -->
  <path d="
    M40,40
    C30,30 20,30 20,40
  "
  stroke="black" fill="none" stroke-width="2"/>
  <path d="
    M45,35
    C35,25 25,25 25,35
  "
  stroke="black" fill="none" stroke-width="2"/>
</svg>