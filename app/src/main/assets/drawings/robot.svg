<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Head -->
  <rect x="70" y="40" width="60" height="40"
        stroke="black" fill="none" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="100" y1="40" x2="100" y2="20"
        stroke="black" stroke-width="2"/>
  <circle cx="100" cy="20" r="3"
          stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="55" r="3"
          stroke="black" fill="none" stroke-width="2"/>
  <circle cx="115" cy="55" r="3"
          stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Mouth -->
  <rect x="85" y="60" width="30" height="5"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Body -->
  <rect x="60" y="80" width="80" height="60"
        stroke="black" fill="none" stroke-width="2"/>
  
  <!-- Arms -->
  <line x1="40" y1="90" x2="60" y2="90"
        stroke="black" stroke-width="2"/>
  <line x1="140" y1="90" x2="160" y2="90"
        stroke="black" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="70" y="140" width="20" height="30"
        stroke="black" fill="none" stroke-width="2"/>
  <rect x="110" y="140" width="20" height="30"
        stroke="black" fill="none" stroke-width="2"/>
</svg>