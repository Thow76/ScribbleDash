<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" 
     viewBox="0 0 100 100">
  <!-- Sofa seat -->
  <rect x="25" y="50" width="50" height="10"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Sofa back -->
  <rect x="25" y="40" width="50" height="10"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Armrests -->
  <rect x="20" y="45" width="5" height="15"
        fill="none" stroke="black" stroke-width="2" />
  <rect x="75" y="45" width="5" height="15"
        fill="none" stroke="black" stroke-width="2" />
  <!-- Cushions (vertical lines) -->
  <line x1="40" y1="40" x2="40" y2="60"
        stroke="black" stroke-width="2"/>
  <line x1="60" y1="40" x2="60" y2="60"
        stroke="black" stroke-width="2"/>
</svg>